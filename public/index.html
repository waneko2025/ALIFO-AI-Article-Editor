<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ALIFO AI 記事編集部</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><div class="logo">A</div><div><b>ALIFO AI</b><span> 記事編集部</span></div></header>
  <main>
    <section class="hero">
      <h1>AI記事編集部</h1>
      <p>URLやRSSから情報を取り込み、AIが記事ドラフトを作成。公開前に人が審査できます。</p>
    </section>

    <section class="panel">
      <h2>① URLから記事を作る</h2>
      <div class="row">
        <input id="url" placeholder="https://example.com/news/..." />
        <button onclick="generate()">記事を生成</button>
      </div>
      <small>ページ本文とOG画像などを取得し、審査待ちボックスへ入れます。</small>
    </section>

    <section class="panel">
      <h2>② RSSを登録</h2>
      <div class="row">
        <input id="rss" placeholder="https://example.com/feed.xml" />
        <button onclick="addRss()">RSSを登録</button>
        <button class="secondary" onclick="runRss()">今すぐ巡回</button>
      </div>
      <div id="sources"></div>
    </section>

    <section>
      <div class="section-head">
        <h2>③ 審査待ちボックス <span id="count">0</span></h2>
        <button class="secondary" onclick="loadQueue()">更新</button>
      </div>
      <div id="queue"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
